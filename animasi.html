<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Orange Premium Background</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        overflow: hidden;
        background: radial-gradient(circle at center, #1a0f05, #000);
      }

      canvas {
        position: fixed;
        top: 0;
        left: 0;
        z-index: -1;
      }
    </style>
  </head>
  <body>
    <canvas id="bg"></canvas>

    <script>
      const canvas = document.getElementById("bg");
      const ctx = canvas.getContext("2d");

      let particles = [];
      const mouse = { x: null, y: null };

      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;

      // Resize
      window.addEventListener("resize", () => {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
      });

      // Mouse
      window.addEventListener("mousemove", (e) => {
        mouse.x = e.x;
        mouse.y = e.y;
      });

      // Particle class
      class Particle {
        constructor() {
          this.x = Math.random() * canvas.width;
          this.y = Math.random() * canvas.height;
          this.size = Math.random() * 4 + 1;
          this.baseX = this.x;
          this.baseY = this.y;
          this.speedX = (Math.random() - 0.5) * 1;
          this.speedY = (Math.random() - 0.5) * 1;
        }

        update() {
          this.x += this.speedX;
          this.y += this.speedY;

          // Soft boundary
          if (this.x < 0 || this.x > canvas.width) this.speedX *= -1;
          if (this.y < 0 || this.y > canvas.height) this.speedY *= -1;

          // ATTRACT to mouse (ini beda dari sebelumnya)
          if (mouse.x && mouse.y) {
            let dx = mouse.x - this.x;
            let dy = mouse.y - this.y;
            let distance = Math.sqrt(dx * dx + dy * dy);

            if (distance < 150) {
              this.x += dx * 0.02;
              this.y += dy * 0.02;
            }
          }
        }

        draw() {
          ctx.beginPath();
          ctx.fillStyle = "rgba(255, 140, 0, 0.9)";
          ctx.shadowColor = "#ff8c00";
          ctx.shadowBlur = 20;
          ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      // Gradient glow follow cursor
      function drawGradient() {
        if (!mouse.x || !mouse.y) return;

        let gradient = ctx.createRadialGradient(
          mouse.x,
          mouse.y,
          0,
          mouse.x,
          mouse.y,
          300,
        );

        gradient.addColorStop(0, "rgba(255,140,0,0.25)");
        gradient.addColorStop(1, "rgba(0,0,0,0)");

        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
      }

      // Init
      function init() {
        particles = [];
        for (let i = 0; i < 140; i++) {
          particles.push(new Particle());
        }
      }

      // Animate
      function animate() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        particles.forEach((p) => {
          p.update();
          p.draw();
        });

        requestAnimationFrame(animate);
      }

      init();
      animate();
    </script>
  </body>
</html>
